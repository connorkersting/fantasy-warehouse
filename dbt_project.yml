name: fantasy_warehouse
version: "0.1.0"
profile: fantasy_warehouse

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  fantasy_warehouse:
    staging:
      +materialized: view
    marts:
      +materialized: table
    audit:
      +materialized: incremental
      +full_refresh: false  # `dbt build --full-refresh` must not erase the reconciliation history

seeds:
  fantasy_warehouse:
    leagues:
      +column_types:
        league_key: varchar
        league_name: varchar
        platform: varchar
        is_enabled: boolean
